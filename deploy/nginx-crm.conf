# Ejemplo de sitio Nginx: fronts estáticos + API Django (gunicorn en 127.0.0.1:8002).
# El certificado lo agrega certbot (certbot --nginx -d crm.ejemplo.com).
server {
	listen 80;
	listen [::]:80;
	server_name crm.ejemplo.com;

	root /opt/solvis-crm/frontends;
	index index.html;
	client_max_body_size 10m;

	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header X-Robots-Tag "noindex, nofollow" always;

	location ~ ^/(api|admin)/ {
		proxy_pass http://127.0.0.1:8002;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 120s;
	}

	location /static/ {
		alias /opt/solvis-crm/staticfiles/;
		expires 7d;
	}

	# Los fronts no tienen build: que el navegador siempre revise si hay versión nueva.
	location ~ \.(js|css|html)$ {
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options nosniff always;
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
